 importCfg  

#---MAIN
<h4reco>
outNameSuffix /eos/cms/store/group/dpg_mtd/comm_mtd/TB/MTDTB_H8_Jul2021/H4DAQ/ntuples/
path2data /eos/cms/store/group/dpg_mtd/comm_mtd/TB/MTDTB_H8_Jul2021/H4DAQ/dataTree/
pluginList WireChamber DigiReco WFReco
run 3742
maxEvents -1
maxFiles -1
</h4reco>


#---Wire Chamber
<WireChamber>
pluginType WireChamberReco
chXleft  2
chXright 3
chYup    0
chYdown  1
tMin 28000
tMax 50000
</WireChamber>

digitizer SCINT MCP TRIG

#---Digi config
<DigiReco>
pluginType DigitizerReco
channelsNames= digitizer
nSamples   1024
tUnit 0.2
</DigiReco>

#---WF reconstruction
<WFReco>
pluginType WFAnalyzer
srcInstanceName DigiReco
channelsNames= DigiReco.channelsNames 
timeRecoTypes CFD LED5 LED10 LED15 LED30 LED50
fillWFtree 1
WFtreePrescale 100
</WFReco>

#first group
<SCINT>
digiBoard 50397185
digiGroup 0
digiChannel 0
polarity -1
nSamples 1024
tUnit 0.2
baselineWin 1 100
baselineInt 30 100
signalWin 400 800 4 4 pol2 0
signalInt 400 1000
CFD 0.5 5
LED5 5 1 3
LED10 10 1 3
LED15 15 1 3
LED30 30 1 3
LED50 50 1 3
</SCINT>

<MCP= SCINT>
digiChannel 1
signalWin 200 350 2 2 gaus 0
signalInt 200 350
</MCP>

<TRIG= SCINT>
digiChannel 8
</TRIG>

